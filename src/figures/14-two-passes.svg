<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 404" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="The op histogram of the two graph types, measured from the engine's trace. Prefill has 443 nodes, decode 440. Matmul 169, rms_norm 49, rope 48, add 48, and 24 each of attn, silu, swiglu, kvcache_store and kvcache_load are identical in both graphs. The entire difference is three nodes: one extra input and two get_rows, which the prefill uses to gather the tail rows that reach the head.">
  <style>
    .fig-t   { fill: var(--fg, #dce6f0); font-size: 12.5px; font-weight: 600; }
    .fig-s   { fill: var(--fg, #cfdae5); font-size: 11.5px; opacity: .94; }
    .fig-m   { fill: var(--fg, #cfdae5); font-size: 10.5px; opacity: .82; }
    .fig-cap { fill: var(--fg, #cfdae5); font-size: 11px; letter-spacing: .10em; opacity: .94; }
    .fig-box { stroke: var(--quote-border, #4a6577); stroke-width: 1; }
    .fig-rule { stroke: var(--quote-border, #4a6577); stroke-width: 1; opacity: .7; }
    .fig-a-pre { fill: #4d86b8; fill-opacity: .58; }
    .fig-a-dec { fill: #b8703f; fill-opacity: .62; }
  </style>
  <text class="fig-cap" x="24" y="22">THE GRAPH IS THE MODEL'S ARITHMETIC</text>
  <text class="fig-s" x="24" y="40">prefill 443 nodes, decode 440 - op counts read out of the engine's per-node trace</text>
  <rect class="fig-a-pre fig-box" x="470" y="52" width="12" height="10" rx="2"/>
  <text class="fig-m" x="488" y="61">prefill</text>
  <rect class="fig-a-dec fig-box" x="548" y="52" width="12" height="10" rx="2"/>
  <text class="fig-m" x="566" y="61">decode</text>
  <text class="fig-m" x="198" y="93" text-anchor="end">matmul</text>
  <rect class="fig-a-pre fig-box" x="210" y="78" width="480.0" height="10" rx="2"/>
  <rect class="fig-a-dec fig-box" x="210" y="89.5" width="480.0" height="10" rx="2"/>
  <text class="fig-m" x="698.0" y="93">169</text>
  <text class="fig-m" x="198" y="120" text-anchor="end">rms_norm</text>
  <rect class="fig-a-pre fig-box" x="210" y="105" width="139.2" height="10" rx="2"/>
  <rect class="fig-a-dec fig-box" x="210" y="116.5" width="139.2" height="10" rx="2"/>
  <text class="fig-m" x="357.2" y="120">49</text>
  <text class="fig-m" x="198" y="147" text-anchor="end">rope</text>
  <rect class="fig-a-pre fig-box" x="210" y="132" width="136.3" height="10" rx="2"/>
  <rect class="fig-a-dec fig-box" x="210" y="143.5" width="136.3" height="10" rx="2"/>
  <text class="fig-m" x="354.3" y="147">48</text>
  <text class="fig-m" x="198" y="174" text-anchor="end">add</text>
  <rect class="fig-a-pre fig-box" x="210" y="159" width="136.3" height="10" rx="2"/>
  <rect class="fig-a-dec fig-box" x="210" y="170.5" width="136.3" height="10" rx="2"/>
  <text class="fig-m" x="354.3" y="174">48</text>
  <text class="fig-m" x="198" y="201" text-anchor="end">attn</text>
  <rect class="fig-a-pre fig-box" x="210" y="186" width="68.2" height="10" rx="2"/>
  <rect class="fig-a-dec fig-box" x="210" y="197.5" width="68.2" height="10" rx="2"/>
  <text class="fig-m" x="286.2" y="201">24</text>
  <text class="fig-m" x="198" y="228" text-anchor="end">silu</text>
  <rect class="fig-a-pre fig-box" x="210" y="213" width="68.2" height="10" rx="2"/>
  <rect class="fig-a-dec fig-box" x="210" y="224.5" width="68.2" height="10" rx="2"/>
  <text class="fig-m" x="286.2" y="228">24</text>
  <text class="fig-m" x="198" y="255" text-anchor="end">swiglu</text>
  <rect class="fig-a-pre fig-box" x="210" y="240" width="68.2" height="10" rx="2"/>
  <rect class="fig-a-dec fig-box" x="210" y="251.5" width="68.2" height="10" rx="2"/>
  <text class="fig-m" x="286.2" y="255">24</text>
  <text class="fig-m" x="198" y="282" text-anchor="end">kvcache_store</text>
  <rect class="fig-a-pre fig-box" x="210" y="267" width="68.2" height="10" rx="2"/>
  <rect class="fig-a-dec fig-box" x="210" y="278.5" width="68.2" height="10" rx="2"/>
  <text class="fig-m" x="286.2" y="282">24</text>
  <text class="fig-m" x="198" y="309" text-anchor="end">kvcache_load</text>
  <rect class="fig-a-pre fig-box" x="210" y="294" width="68.2" height="10" rx="2"/>
  <rect class="fig-a-dec fig-box" x="210" y="305.5" width="68.2" height="10" rx="2"/>
  <text class="fig-m" x="286.2" y="309">24</text>
  <text class="fig-m" x="198" y="336" text-anchor="end">get_rows</text>
  <rect class="fig-a-pre fig-box" x="210" y="321" width="8.5" height="10" rx="2"/>
  <rect class="fig-a-dec fig-box" x="210" y="332.5" width="2.8" height="10" rx="2"/>
  <text class="fig-m" x="226.5" y="336">3 / 1</text>
  <text class="fig-m" x="198" y="363" text-anchor="end">input</text>
  <rect class="fig-a-pre fig-box" x="210" y="348" width="17.0" height="10" rx="2"/>
  <rect class="fig-a-dec fig-box" x="210" y="359.5" width="14.2" height="10" rx="2"/>
  <text class="fig-m" x="235.0" y="363">6 / 5</text>
  <line class="fig-rule" x1="24" y1="381" x2="786" y2="381"/>
  <text class="fig-s" x="24" y="401">The only difference between the two graphs is three nodes: one input (tail_ids) and two get_rows.</text>
</svg>
