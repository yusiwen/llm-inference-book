<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 316" width="100%" style="max-width:100%;height:auto"
  role="img" aria-label="The matmul ladder as five rungs read left to right: elementwise, gather, tiled f16 GEMM, integer matmul for prefill, and matrix-vector for decode, each with the reuse it gains and the bound it hits on the machine measured here.">
  <style>
    .g-cap { fill: var(--fg, #cfdae5); font-size: 11px; letter-spacing: .10em; opacity: .94; }
    .g-s   { fill: var(--fg, #cfdae5); font-size: 11.5px; opacity: .94; }
    .g-m   { fill: var(--fg, #cfdae5); font-size: 10.5px; opacity: .82; }
    .g-lbl { fill: var(--fg, #cfdae5); font-size: 10.5px; opacity: .95; }
    .fig-a-r1 { fill: #4a6577; fill-opacity: .30; stroke: var(--quote-border, #4a6577); stroke-width: .8; }
    .fig-a-r2 { fill: #3f7f76; fill-opacity: .38; stroke: var(--quote-border, #4a6577); stroke-width: .8; }
    .fig-a-r3 { fill: #8f7ad1; fill-opacity: .38; stroke: var(--quote-border, #4a6577); stroke-width: .8; }
    .fig-a-r4 { fill: #4d86b8; fill-opacity: .42; stroke: var(--quote-border, #4a6577); stroke-width: .8; }
    .fig-a-r5 { fill: #b85c4d; fill-opacity: .42; stroke: var(--quote-border, #4a6577); stroke-width: 1.1; }
    .g-rule { stroke: var(--quote-border, #4a6577); stroke-width: 1; opacity: .5; }
    .g-arrow { stroke: var(--quote-border, #4a6577); stroke-width: 1.2; opacity: .7; fill: none; }
  </style>
  <text class="g-cap" x="24" y="24">THE LADDER, CLIMBED LEFT TO RIGHT</text>
  <text class="g-s" x="24" y="44">each rung is written only after the one before it passes the gate; the shape decides which rung an engine runs</text>
  <rect x="30" y="66" width="140" height="34" rx="2" class="fig-a-r1"/>
  <text class="g-lbl" x="100" y="87" text-anchor="middle">1 elementwise</text>
  <text class="g-m" x="100" y="118" text-anchor="middle">reuse 0</text>
  <text class="g-m" x="100" y="133" text-anchor="middle">pure streaming</text>
  <text class="g-m" x="100" y="148" text-anchor="middle">bound: bandwidth</text>
  <rect x="192" y="66" width="140" height="34" rx="2" class="fig-a-r2"/>
  <text class="g-lbl" x="262" y="87" text-anchor="middle">2 gather</text>
  <text class="g-m" x="262" y="118" text-anchor="middle">reuse 0</text>
  <text class="g-m" x="262" y="133" text-anchor="middle">one indirection</text>
  <text class="g-m" x="262" y="148" text-anchor="middle">bound: dependency</text>
  <rect x="354" y="66" width="140" height="34" rx="2" class="fig-a-r3"/>
  <text class="g-lbl" x="424" y="87" text-anchor="middle">3 tiled f16 GEMM</text>
  <text class="g-m" x="424" y="118" text-anchor="middle">reuse TILE</text>
  <text class="g-m" x="424" y="133" text-anchor="middle">shared memory</text>
  <text class="g-m" x="424" y="148" text-anchor="middle">bound: latency hiding</text>
  <rect x="516" y="66" width="140" height="34" rx="2" class="fig-a-r4"/>
  <text class="g-lbl" x="586" y="87" text-anchor="middle">4 int8 matmul</text>
  <text class="g-m" x="586" y="118" text-anchor="middle">reuse M</text>
  <text class="g-m" x="586" y="133" text-anchor="middle">__dp4a, 4 per instr</text>
  <text class="g-m" x="586" y="148" text-anchor="middle">bound: scalar unpack</text>
  <rect x="678" y="66" width="106" height="34" rx="2" class="fig-a-r5"/>
  <text class="g-lbl" x="731" y="87" text-anchor="middle">5 matrix-vector</text>
  <text class="g-m" x="731" y="118" text-anchor="middle">reuse 1</text>
  <text class="g-m" x="731" y="133" text-anchor="middle">every weight once</text>
  <text class="g-m" x="731" y="148" text-anchor="middle">bound: access pattern</text>
  <path class="g-arrow" d="M172 83 L190 83 M334 83 L352 83 M496 83 L514 83 M658 83 L676 83"/>
  <line class="g-rule" x1="24" y1="176" x2="786" y2="176"/>
  <text class="g-m" x="24" y="200">The last rung is the one an engine spends its life in, and the only one whose cost is set by the access pattern</text>
  <text class="g-m" x="24" y="216">rather than by the arithmetic. Measured on the GB10, the decode rung reads its weights at about a sixth of the streaming rate</text>
  <text class="g-m" x="24" y="232">Chapter 22 measured on the same machine - the access pattern, not the unpacking, is the gap.</text>
  <text class="g-m" x="24" y="260">Every rung above was compared with a host reference before it was timed. On this data the deviations are</text>
  <text class="g-m" x="24" y="276">exactly zero because the operands are small integer multiples and both paths sum in the same order; on real</text>
  <text class="g-m" x="24" y="292">weights the same comparison lands near 1e-5, which is what the tolerance column in the chapter's table is for.</text>
</svg>
