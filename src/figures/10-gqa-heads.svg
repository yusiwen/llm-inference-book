<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 400" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="Grouped-query attention: fourteen query heads are assigned to two cached key-value heads, seven query heads per key head, so the cache stores 512 bytes per token per layer instead of 3,584 for fourteen key heads - a factor of seven, which is 48 mebibytes for a 4,096-token context and 20.5 per cent of the weights at 8,192 tokens.">
  <style>
    .fig-t   { fill: var(--fg, #dce6f0); font-size: 12.5px; font-weight: 600; }
    .fig-s   { fill: var(--fg, #cfdae5); font-size: 11.5px; opacity: .94; }
    .fig-m   { fill: var(--fg, #cfdae5); font-size: 10.5px; opacity: .82; }
    .fig-cap { fill: var(--fg, #cfdae5); font-size: 11px; letter-spacing: .10em; opacity: .94; }
    .fig-a-q  { fill: #4d86b8; fill-opacity: .40; stroke: var(--quote-border, #4a6577); stroke-width: .8; }
    .fig-a-kv { fill: #b8703f; fill-opacity: .45; stroke: var(--quote-border, #4a6577); stroke-width: .8; }
    .fig-link { stroke: var(--quote-border, #6b7f92); stroke-width: 1; fill: none; opacity: .85; }
    .fig-rule { stroke: var(--quote-border, #4a6577); stroke-width: 1; }
    .fig-lbl { fill: var(--fg, #dce6f0); font-size: 10px; }
  </style>
  <text class="fig-cap" x="24" y="22">FOURTEEN QUERIES, TWO CACHED HEADS</text>
  <text class="fig-s" x="24" y="42">which heads read which cache, and the arithmetic that decides it</text>
  <text class="fig-m" x="96" y="72" text-anchor="middle">query heads</text>
  <text class="fig-m" x="330" y="72" text-anchor="middle">cached K/V heads</text>
  <rect class="fig-a-q" x="62" y="88" width="68" height="14" rx="2"/>
  <text class="fig-lbl" x="96" y="98.5" text-anchor="middle">q0</text>
  <path class="fig-link" d="M130 95 C 190 95, 210 141.5, 268 141.5"/>
  <rect class="fig-a-q" x="62" y="105" width="68" height="14" rx="2"/>
  <text class="fig-lbl" x="96" y="115.5" text-anchor="middle">q1</text>
  <path class="fig-link" d="M130 112 C 190 112, 210 141.5, 268 141.5"/>
  <rect class="fig-a-q" x="62" y="122" width="68" height="14" rx="2"/>
  <text class="fig-lbl" x="96" y="132.5" text-anchor="middle">q2</text>
  <path class="fig-link" d="M130 129 C 190 129, 210 141.5, 268 141.5"/>
  <rect class="fig-a-q" x="62" y="139" width="68" height="14" rx="2"/>
  <text class="fig-lbl" x="96" y="149.5" text-anchor="middle">q3</text>
  <path class="fig-link" d="M130 146 C 190 146, 210 141.5, 268 141.5"/>
  <rect class="fig-a-q" x="62" y="156" width="68" height="14" rx="2"/>
  <text class="fig-lbl" x="96" y="166.5" text-anchor="middle">q4</text>
  <path class="fig-link" d="M130 163 C 190 163, 210 141.5, 268 141.5"/>
  <rect class="fig-a-q" x="62" y="173" width="68" height="14" rx="2"/>
  <text class="fig-lbl" x="96" y="183.5" text-anchor="middle">q5</text>
  <path class="fig-link" d="M130 180 C 190 180, 210 141.5, 268 141.5"/>
  <rect class="fig-a-q" x="62" y="190" width="68" height="14" rx="2"/>
  <text class="fig-lbl" x="96" y="200.5" text-anchor="middle">q6</text>
  <path class="fig-link" d="M130 197 C 190 197, 210 141.5, 268 141.5"/>
  <rect class="fig-a-q" x="62" y="207" width="68" height="14" rx="2"/>
  <text class="fig-lbl" x="96" y="217.5" text-anchor="middle">q7</text>
  <path class="fig-link" d="M130 214 C 190 214, 210 277.5, 268 277.5"/>
  <rect class="fig-a-q" x="62" y="224" width="68" height="14" rx="2"/>
  <text class="fig-lbl" x="96" y="234.5" text-anchor="middle">q8</text>
  <path class="fig-link" d="M130 231 C 190 231, 210 277.5, 268 277.5"/>
  <rect class="fig-a-q" x="62" y="241" width="68" height="14" rx="2"/>
  <text class="fig-lbl" x="96" y="251.5" text-anchor="middle">q9</text>
  <path class="fig-link" d="M130 248 C 190 248, 210 277.5, 268 277.5"/>
  <rect class="fig-a-q" x="62" y="258" width="68" height="14" rx="2"/>
  <text class="fig-lbl" x="96" y="268.5" text-anchor="middle">q10</text>
  <path class="fig-link" d="M130 265 C 190 265, 210 277.5, 268 277.5"/>
  <rect class="fig-a-q" x="62" y="275" width="68" height="14" rx="2"/>
  <text class="fig-lbl" x="96" y="285.5" text-anchor="middle">q11</text>
  <path class="fig-link" d="M130 282 C 190 282, 210 277.5, 268 277.5"/>
  <rect class="fig-a-q" x="62" y="292" width="68" height="14" rx="2"/>
  <text class="fig-lbl" x="96" y="302.5" text-anchor="middle">q12</text>
  <path class="fig-link" d="M130 299 C 190 299, 210 277.5, 268 277.5"/>
  <rect class="fig-a-q" x="62" y="309" width="68" height="14" rx="2"/>
  <text class="fig-lbl" x="96" y="319.5" text-anchor="middle">q13</text>
  <path class="fig-link" d="M130 316 C 190 316, 210 277.5, 268 277.5"/>
  <rect class="fig-a-kv" x="268" y="130.5" width="120" height="22" rx="2"/>
  <text class="fig-lbl" x="328" y="145.5" text-anchor="middle">kv 0: 7 queries</text>
  <rect class="fig-a-kv" x="268" y="266.5" width="120" height="22" rx="2"/>
  <text class="fig-lbl" x="328" y="281.5" text-anchor="middle">kv 1: 7 queries</text>
  <line class="fig-rule" x1="24" y1="356" x2="786" y2="356"/>
  <text class="fig-s" x="24" y="378">Grouped-query attention is this picture and nothing else: the queries stay as many as the model wants, and the</text>
  <text class="fig-s" x="24" y="394">cache keeps one key/value head per group, so the 14 heads above share 2 caches instead of holding 14.</text>
  <text class="fig-m" x="420" y="104">per token per layer, f16:</text>
  <text class="fig-lbl" x="420" y="122">2 x 2 kv heads x 64 dims x 2 B = 512 B</text>
  <text class="fig-m" x="420" y="146">what 14 separate key heads would cost:</text>
  <text class="fig-lbl" x="420" y="164">2 x 14 x 64 x 2 B = 3,584 B, or 7x more</text>
  <text class="fig-m" x="420" y="188">across 24 layers and a 4,096-token context:</text>
  <text class="fig-t" x="420" y="208">48 MiB, and 96 MiB at 8,192</text>
  <text class="fig-m" x="420" y="232">20.5 per cent of this 0.5B model of weights, at 8,192 tokens.</text>
  <text class="fig-m" x="420" y="247">The same ratio in a 7B model is where a long conversation stops</text>
  <text class="fig-m" x="420" y="262">fitting - which is why the cache format is a per-engine gate rather</text>
  <text class="fig-m" x="420" y="277">than a detail (ADR-0006).</text>
</svg>
