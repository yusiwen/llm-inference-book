<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 470" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="Two register shapes for the same 32 quantized weights: AVX2 unpacks 32 nibbles into a 256-bit register of 32 signed bytes, multiplies unsigned bytes by signed bytes with maddubs into 16 16-bit pair sums, widens to 8 32-bit lanes, and folds those into an f32 accumulator; NEON issues two SDOT instructions that each reduce 16 weights into four 32-bit lanes, so 32 weights become four floats and the horizontal fold happens once at the end.">
  <style>
    .fig-t    { fill: var(--fg, #dce6f0); font-size: 12.5px; font-weight: 600; }
    .fig-s    { fill: var(--fg, #cfdae5); font-size: 11.5px; opacity: .94; }
    .fig-m    { fill: var(--fg, #cfdae5); font-size: 10.5px; opacity: .82; }
    .fig-cap  { fill: var(--fg, #cfdae5); font-size: 11px; letter-spacing: .10em; opacity: .94; }
    .fig-a-lane { fill: var(--table-alternate-bg, #0f2438); stroke: var(--quote-border, #4a6577); stroke-width: .8; }
    .fig-a-i8   { fill: #4d86b8; }
    .fig-a-i16  { fill: #b8703f; }
    .fig-a-i32  { fill: #3f8f6f; }
    .fig-a-f32  { fill: #6b7f92; }
  </style>
  <text class="fig-cap" x="24" y="22">THE SAME 32 WEIGHTS, TWO REGISTER SHAPES</text>
  <text class="fig-t" x="24" y="58">AVX2: 32 signed bytes, pair sums in 16 bits, 8 i32 lanes</text>
  <rect class="fig-a-i8" x="24" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="35" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="46" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="57" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="68" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="79" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="90" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="101" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="112" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="123" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="134" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="145" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="156" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="167" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="178" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="189" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="200" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="211" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="222" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="233" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="244" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="255" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="266" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="277" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="288" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="299" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="310" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="321" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="332" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="343" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="354" y="70" width="9" height="14" rx="1"/>
  <rect class="fig-a-i8" x="365" y="70" width="9" height="14" rx="1"/>
  <text class="fig-m" x="382" y="81">32 x i8 (nibble - 8)</text>
  <text class="fig-m" x="24" y="102">vpmaddubsw: unsigned weights x signed activations, two products per lane</text>
  <rect class="fig-a-i16" x="24" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="46" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="68" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="90" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="112" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="134" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="156" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="178" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="200" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="222" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="244" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="266" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="288" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="310" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="332" y="110" width="20" height="14" rx="1"/>
  <rect class="fig-a-i16" x="354" y="110" width="20" height="14" rx="1"/>
  <text class="fig-m" x="382" y="121">16 x i16</text>
  <text class="fig-m" x="24" y="144">vpmaddwd with ones: widen and add pairs</text>
  <rect class="fig-a-i32" x="24" y="152" width="42" height="14" rx="1"/>
  <rect class="fig-a-i32" x="68" y="152" width="42" height="14" rx="1"/>
  <rect class="fig-a-i32" x="112" y="152" width="42" height="14" rx="1"/>
  <rect class="fig-a-i32" x="156" y="152" width="42" height="14" rx="1"/>
  <rect class="fig-a-i32" x="200" y="152" width="42" height="14" rx="1"/>
  <rect class="fig-a-i32" x="244" y="152" width="42" height="14" rx="1"/>
  <rect class="fig-a-i32" x="288" y="152" width="42" height="14" rx="1"/>
  <rect class="fig-a-i32" x="332" y="152" width="42" height="14" rx="1"/>
  <text class="fig-m" x="382" y="163">8 x i32</text>
  <text class="fig-m" x="24" y="186">vfmadd: one f32 multiply per block, accumulated into 8 lanes</text>
  <rect class="fig-a-f32" x="24" y="194" width="42" height="12" rx="1"/>
  <rect class="fig-a-f32" x="68" y="194" width="42" height="12" rx="1"/>
  <rect class="fig-a-f32" x="112" y="194" width="42" height="12" rx="1"/>
  <rect class="fig-a-f32" x="156" y="194" width="42" height="12" rx="1"/>
  <rect class="fig-a-f32" x="200" y="194" width="42" height="12" rx="1"/>
  <rect class="fig-a-f32" x="244" y="194" width="42" height="12" rx="1"/>
  <rect class="fig-a-f32" x="288" y="194" width="42" height="12" rx="1"/>
  <rect class="fig-a-f32" x="332" y="194" width="42" height="12" rx="1"/>
  <text class="fig-m" x="382" y="204">8 x f32</text>
  <text class="fig-t" x="24" y="250">NEON with SDOT: 16 weights per instruction, four i32 lanes</text>
  <rect class="fig-a-i8" x="24" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="46" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="68" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="90" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="112" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="134" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="156" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="178" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="200" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="222" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="244" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="266" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="288" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="310" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="332" y="262" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="354" y="262" width="20" height="14" rx="1"/>
  <text class="fig-m" x="382" y="273">int8x16: low nibbles</text>
  <rect class="fig-a-i8" x="24" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="46" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="68" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="90" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="112" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="134" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="156" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="178" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="200" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="222" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="244" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="266" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="288" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="310" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="332" y="282" width="20" height="14" rx="1"/>
  <rect class="fig-a-i8" x="354" y="282" width="20" height="14" rx="1"/>
  <text class="fig-m" x="382" y="293">int8x16: high nibbles</text>
  <text class="fig-m" x="24" y="316">two sdot instructions: each does 4 lanes x 4 products, adding into i32</text>
  <rect class="fig-a-i32" x="24" y="324" width="86" height="16" rx="1"/>
  <rect class="fig-a-i32" x="112" y="324" width="86" height="16" rx="1"/>
  <rect class="fig-a-i32" x="200" y="324" width="86" height="16" rx="1"/>
  <rect class="fig-a-i32" x="288" y="324" width="86" height="16" rx="1"/>
  <text class="fig-m" x="382" y="336">4 x i32 (32 weights!)</text>
  <text class="fig-m" x="24" y="360">scvtf + fma: four floats per block, no horizontal add</text>
  <rect class="fig-a-f32" x="24" y="368" width="86" height="12" rx="1"/>
  <rect class="fig-a-f32" x="112" y="368" width="86" height="12" rx="1"/>
  <rect class="fig-a-f32" x="200" y="368" width="86" height="12" rx="1"/>
  <rect class="fig-a-f32" x="288" y="368" width="86" height="12" rx="1"/>
  <text class="fig-m" x="382" y="378">4 x f32</text>
  <text class="fig-t" x="24" y="396">what the shapes decide</text>
  <text class="fig-s" x="24" y="416">AVX2 multiplies unsigned by signed, so the weight's sign has to move onto the activation first (abs + sign).</text>
  <text class="fig-s" x="24" y="434">SDOT is signed by signed: no such trick, and no widening step between the multiply and the i32 lane.</text>
  <text class="fig-s" x="24" y="452">Both fold once at the end; folding per block (a horizontal add every 32 weights) costs more than the vector width buys.</text>
</svg>
