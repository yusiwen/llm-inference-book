<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 330" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="The sampler pipeline on one measured step. 151,936 logits enter; top-k 40 keeps 40; top-p 0.95 keeps 21; temperature changes the weights but not the set; one token is drawn. To the right, the same top-p count for all 24 steps of the run: between 1 and 21, median 2.5, so top-k never bound and top-p did the cutting.">
  <style>
    .fig-t   { fill: var(--fg, #dce6f0); font-size: 12.5px; font-weight: 600; }
    .fig-s   { fill: var(--fg, #cfdae5); font-size: 11.5px; opacity: .94; }
    .fig-m   { fill: var(--fg, #cfdae5); font-size: 10.5px; opacity: .82; }
    .fig-cap { fill: var(--fg, #cfdae5); font-size: 11px; letter-spacing: .10em; opacity: .94; }
    .fig-box { stroke: var(--quote-border, #4a6577); stroke-width: 1; }
    .fig-rule { stroke: var(--quote-border, #4a6577); stroke-width: 1; opacity: .7; }
    .fig-a-raw { fill: #7a8a99; fill-opacity: .40; }
    .fig-a-k   { fill: #4d86b8; fill-opacity: .55; }
    .fig-a-p   { fill: #b8703f; fill-opacity: .62; }
    .fig-a-one { fill: #8f7ad1; fill-opacity: .78; }
  </style>
  <text class="fig-cap" x="24" y="22">THE FUNNEL, MEASURED ON ONE STEP</text>
  <text class="fig-s" x="24" y="40">prompt "My favourite programming language is"; step logits_prefill_00000.f32; bar length is log10 of the candidates left</text>
  <text class="fig-m" x="166" y="91" text-anchor="end">raw logits</text>
  <rect class="fig-a-raw fig-box" x="176" y="72" width="560.0" height="26" rx="3"/>
  <text class="fig-t" x="746.0" y="90">151,936</text>
  <text class="fig-m" x="166" y="133" text-anchor="end">after top-k 40</text>
  <rect class="fig-a-k fig-box" x="176" y="114" width="173.1" height="26" rx="3"/>
  <text class="fig-t" x="359.1" y="132">40</text>
  <text class="fig-m" x="166" y="175" text-anchor="end">after top-p 0.95</text>
  <rect class="fig-a-p fig-box" x="176" y="156" width="142.9" height="26" rx="3"/>
  <text class="fig-t" x="328.9" y="174">21</text>
  <text class="fig-m" x="166" y="217" text-anchor="end">after temperature</text>
  <rect class="fig-a-p fig-box" x="176" y="198" width="142.9" height="26" rx="3"/>
  <text class="fig-t" x="328.9" y="216">21</text>
  <text class="fig-m" x="166" y="259" text-anchor="end">what is drawn</text>
  <rect class="fig-a-one fig-box" x="176" y="240" width="2.0" height="26" rx="3"/>
  <text class="fig-t" x="188.0" y="258">1</text>
  <line class="fig-rule" x1="600" y1="64" x2="600" y2="268"/>
  <text class="fig-m" x="616" y="60">after top-p, every step</text>
  <rect class="fig-a-p fig-box" x="616.0" y="64.0" width="4.6" height="170.0" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="623.1" y="217.8" width="4.6" height="16.2" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="630.2" y="217.8" width="4.6" height="16.2" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="637.2" y="209.7" width="4.6" height="24.3" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="644.3" y="225.9" width="4.6" height="8.1" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="651.4" y="217.8" width="4.6" height="16.2" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="658.5" y="225.9" width="4.6" height="8.1" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="665.6" y="193.5" width="4.6" height="40.5" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="672.7" y="225.9" width="4.6" height="8.1" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="679.8" y="225.9" width="4.6" height="8.1" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="686.8" y="217.8" width="4.6" height="16.2" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="693.9" y="225.9" width="4.6" height="8.1" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="701.0" y="201.6" width="4.6" height="32.4" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="708.1" y="120.7" width="4.6" height="113.3" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="715.2" y="193.5" width="4.6" height="40.5" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="722.2" y="209.7" width="4.6" height="24.3" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="729.3" y="225.9" width="4.6" height="8.1" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="736.4" y="201.6" width="4.6" height="32.4" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="743.5" y="225.9" width="4.6" height="8.1" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="750.6" y="177.3" width="4.6" height="56.7" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="757.7" y="201.6" width="4.6" height="32.4" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="764.8" y="209.7" width="4.6" height="24.3" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="771.8" y="177.3" width="4.6" height="56.7" rx="1.5"/>
  <rect class="fig-a-p fig-box" x="778.9" y="225.9" width="4.6" height="8.1" rx="1.5"/>
  <text class="fig-m" x="616" y="250">24 steps: median 2.5, widest 21</text>
  <text class="fig-m" x="616" y="266">top-k held 40 on all of them</text>
  <line class="fig-rule" x1="24" y1="288" x2="786" y2="288"/>
  <text class="fig-s" x="24" y="308">Top-k is a lid; top-p is what actually cuts. Temperature is last and removes</text>
  <text class="fig-s" x="24" y="324">nothing: it reweights the survivors, then one is drawn.</text>
</svg>
