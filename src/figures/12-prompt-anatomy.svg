<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 330" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="One user turn rendered by the model's own chat template, drawn twice: once with each segment as wide as its bytes, and once with every token the same width. The prompt is 178 bytes and 36 tokens. The user's question is 35 bytes and 9 tokens; the default system sentence the template inserts is 75 bytes and 18 tokens; the five role markers are 5 tokens, the two standalone newlines 2 tokens, and the generation prefix 10 bytes and 2 tokens. Twenty-seven of the thirty-six tokens are not the user's text.">
  <style>
    .fig-t   { fill: var(--fg, #dce6f0); font-size: 12.5px; font-weight: 600; }
    .fig-s   { fill: var(--fg, #cfdae5); font-size: 11.5px; opacity: .94; }
    .fig-m   { fill: var(--fg, #cfdae5); font-size: 10.5px; opacity: .82; }
    .fig-cap { fill: var(--fg, #cfdae5); font-size: 11px; letter-spacing: .10em; opacity: .94; }
    .fig-box { stroke: var(--quote-border, #4a6577); stroke-width: 1; }
    .fig-rule { stroke: var(--quote-border, #4a6577); stroke-width: 1; opacity: .7; }
    .fig-a-mark { fill: #8f7ad1; fill-opacity: .78; }
    .fig-a-tpl  { fill: #4d86b8; fill-opacity: .55; }
    .fig-a-user { fill: #b8703f; fill-opacity: .62; }
    .fig-a-gen  { fill: #5c9a72; fill-opacity: .60; }
    .fig-a-nl   { fill: #7a8a99; fill-opacity: .45; }
  </style>
