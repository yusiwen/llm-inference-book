<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 428" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="The merge loop on the six byte marks of the string hello with a leading space. Round zero starts from six single characters; each round joins the adjacent pair with the lowest rank in the merge table, with ranks 45, 49, 129, 4535 and 23555, and the number of units falls from six to one, which is the single vocabulary token 23811.">
  <style>
    .fig-t   { fill: var(--fg, #dce6f0); font-size: 12.5px; font-weight: 600; }
    .fig-s   { fill: var(--fg, #cfdae5); font-size: 11.5px; opacity: .94; }
    .fig-m   { fill: var(--fg, #cfdae5); font-size: 10.5px; opacity: .82; }
    .fig-cap { fill: var(--fg, #cfdae5); font-size: 11px; letter-spacing: .10em; opacity: .94; }
    .fig-box { fill: var(--quote-bg, #1d2833); stroke: var(--quote-border, #4a6577); stroke-width: 1; }
    .fig-unit { fill: var(--fg, #dce6f0); font-size: 12.5px; }
    .fig-rank { fill: var(--fg, #cfdae5); font-size: 11px; opacity: .9; }
    /* the pair that won this round: one accent, semantic class so a theme change cannot drop it */
    .fig-a-win { stroke: #8f7ad1; stroke-width: 2.2; }
    .fig-a-tok1 { fill: #4d86b8; fill-opacity: .55; }
    .fig-a-tok2 { fill: #b8703f; fill-opacity: .55; }
    .fig-a-hold { stroke: #b8703f; stroke-width: 2; stroke-dasharray: 4 3; }
  </style>
  <text class="fig-cap" x="24" y="22">THE MERGE LOOP ON ONE PIECE</text>
  <text class="fig-s" x="24" y="40">" hello": six bytes, six marks, five merges, one token</text>
  <text class="fig-m" x="110" y="62">units after the round</text>
  <text class="fig-m" x="700" y="62" text-anchor="end">lowest available pair</text>
  <text class="fig-m" x="24" y="102">start</text>
  <rect class="fig-box" x="110" y="86" width="26" height="26" rx="3"/>
  <text class="fig-unit" x="123.0" y="104" text-anchor="middle">_</text>
  <rect class="fig-box" x="142" y="86" width="26" height="26" rx="3"/>
  <text class="fig-unit" x="155.0" y="104" text-anchor="middle">h</text>
  <rect class="fig-box" x="174" y="86" width="26" height="26" rx="3"/>
  <text class="fig-unit" x="187.0" y="104" text-anchor="middle">e</text>
  <rect class="fig-box" x="206" y="86" width="26" height="26" rx="3"/>
  <text class="fig-unit" x="219.0" y="104" text-anchor="middle">l</text>
  <rect class="fig-box" x="238" y="86" width="26" height="26" rx="3"/>
  <text class="fig-unit" x="251.0" y="104" text-anchor="middle">l</text>
  <rect class="fig-box" x="270" y="86" width="26" height="26" rx="3"/>
  <text class="fig-unit" x="283.0" y="104" text-anchor="middle">o</text>
  <text class="fig-m" x="24" y="154">round 1</text>
  <rect class="fig-box" x="110" y="138" width="26" height="26" rx="3"/>
  <text class="fig-unit" x="123.0" y="156" text-anchor="middle">_</text>
  <rect class="fig-box" x="142" y="138" width="26" height="26" rx="3"/>
  <text class="fig-unit" x="155.0" y="156" text-anchor="middle">h</text>
  <rect class="fig-box fig-a-win" x="174" y="138" width="32" height="26" rx="3"/>
  <text class="fig-unit" x="190.0" y="156" text-anchor="middle">el</text>
  <rect class="fig-box" x="212" y="138" width="26" height="26" rx="3"/>
  <text class="fig-unit" x="225.0" y="156" text-anchor="middle">l</text>
  <rect class="fig-box" x="244" y="138" width="26" height="26" rx="3"/>
  <text class="fig-unit" x="257.0" y="156" text-anchor="middle">o</text>
  <text class="fig-rank" x="700" y="156" text-anchor="end">rank 45</text>
  <text class="fig-m" x="24" y="206">round 2</text>
  <rect class="fig-box fig-a-win" x="110" y="190" width="32" height="26" rx="3"/>
  <text class="fig-unit" x="126.0" y="208" text-anchor="middle">_h</text>
  <rect class="fig-box" x="148" y="190" width="32" height="26" rx="3"/>
  <text class="fig-unit" x="164.0" y="208" text-anchor="middle">el</text>
  <rect class="fig-box" x="186" y="190" width="26" height="26" rx="3"/>
  <text class="fig-unit" x="199.0" y="208" text-anchor="middle">l</text>
  <rect class="fig-box" x="218" y="190" width="26" height="26" rx="3"/>
  <text class="fig-unit" x="231.0" y="208" text-anchor="middle">o</text>
  <text class="fig-rank" x="700" y="208" text-anchor="end">rank 49</text>
  <text class="fig-m" x="24" y="258">round 3</text>
  <rect class="fig-box" x="110" y="242" width="32" height="26" rx="3"/>
  <text class="fig-unit" x="126.0" y="260" text-anchor="middle">_h</text>
  <rect class="fig-box" x="148" y="242" width="32" height="26" rx="3"/>
  <text class="fig-unit" x="164.0" y="260" text-anchor="middle">el</text>
  <rect class="fig-box fig-a-win" x="186" y="242" width="32" height="26" rx="3"/>
  <text class="fig-unit" x="202.0" y="260" text-anchor="middle">lo</text>
  <text class="fig-rank" x="700" y="260" text-anchor="end">rank 129</text>
  <text class="fig-m" x="24" y="310">round 4</text>
  <rect class="fig-box" x="110" y="294" width="32" height="26" rx="3"/>
  <text class="fig-unit" x="126.0" y="312" text-anchor="middle">_h</text>
  <rect class="fig-box fig-a-win" x="148" y="294" width="48" height="26" rx="3"/>
  <text class="fig-unit" x="172.0" y="312" text-anchor="middle">ello</text>
  <text class="fig-rank" x="700" y="312" text-anchor="end">rank 4,535</text>
  <text class="fig-m" x="24" y="362">round 5</text>
  <rect class="fig-box fig-a-win" x="110" y="346" width="65" height="26" rx="3"/>
  <text class="fig-unit" x="142.5" y="364" text-anchor="middle">_hello</text>
  <text class="fig-rank" x="700" y="364" text-anchor="end">rank 23,555</text>
  <text class="fig-m" x="24" y="406">the text never changes - only where the cuts are. Five rounds, one token: id 23811. The leading space is drawn as _.</text>
</svg>
