<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 392" width="100%" style="max-width:100%;height:auto"
  role="img" aria-label="Backend assignment measured on one run. The registry holds three ids, cpu 0, metal 1, cuda 2, and the assignment order is priority, metal 300 then cuda 200 then cpu 100. This build has cpu and metal registered and cuda not compiled in. The run assigned all 443 prefill nodes to cpu, which is one contiguous split and zero cross-split edges, so nothing had to be copied across a device boundary.">
  <style>
    .g-cap { fill: var(--fg, #cfdae5); font-size: 11px; letter-spacing: .10em; opacity: .94; }
    .g-s   { fill: var(--fg, #cfdae5); font-size: 11.5px; opacity: .94; }
    .g-m   { fill: var(--fg, #cfdae5); font-size: 10.5px; opacity: .82; }
    .g-n   { fill: var(--fg, #dce6f0); font-size: 11.5px; font-weight: 600; }
    .g-box { stroke: var(--quote-border, #4a6577); stroke-width: 1; }
    .g-rule { stroke: var(--quote-border, #4a6577); stroke-width: 1; opacity: .55; }
    .fig-a-metal { fill: #8f7ad1; fill-opacity: .28; }
    .fig-a-cuda { fill: #6b7a86; fill-opacity: .16; }
    .fig-a-cpu { fill: #4d86b8; fill-opacity: .40; }
    .fig-a-cell { fill: #4d86b8; fill-opacity: .34; stroke: var(--quote-border, #4a6577); stroke-width: .4; }
  </style>
  <text class="g-cap" x="24" y="24">ONE GRAPH, ONE SPLIT</text>
  <text class="g-s" x="24" y="44">the assignment this machine produced, and the three rungs it was chosen from</text>
  <text class="g-m" x="24" y="76">priority</text>
  <rect class="fig-a-metal g-box" x="120" y="90" width="330" height="34" rx="4"/>
  <text class="g-n" x="134" y="112">metal</text>
  <text class="g-m" x="200" y="112">priority 300</text>
  <text class="g-m" x="300" y="112">registered, 0 nodes this run</text>
  <text class="g-m" x="470" y="112">id 1</text>
  <rect class="fig-a-cuda g-box" x="120" y="130" width="330" height="34" rx="4"/>
  <text class="g-n" x="134" y="152">cuda</text>
  <text class="g-m" x="200" y="152">priority 200</text>
  <text class="g-m" x="300" y="152">not compiled into this build</text>
  <text class="g-m" x="470" y="152">id 2</text>
  <rect class="fig-a-cpu g-box" x="120" y="170" width="330" height="34" rx="4"/>
  <text class="g-n" x="134" y="192">cpu</text>
  <text class="g-m" x="200" y="192">priority 100</text>
  <text class="g-m" x="300" y="192">registered, all nodes this run</text>
  <text class="g-m" x="470" y="192">id 0</text>
  <line class="g-rule" x1="24" y1="216" x2="786" y2="216"/>
  <text class="g-m" x="24" y="240">the graph, node by node</text>
  <text class="g-m" x="24" y="258">443 nodes, one contiguous run, 0 cross-split edges</text>
