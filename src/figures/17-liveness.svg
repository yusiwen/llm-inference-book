<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 336" width="100%" style="max-width:100%;height:auto"
  role="img" aria-label="One arena, four numbers. Giving every transient buffer its own allocation would need 84.7 mebibytes. The engine's pool high-water mark is 3.00 mebibytes, 28.2 times smaller. Inside that pool, the peak live set is 2.05 mebibytes and the live set at the end of the prefill phase is 0.60 mebibytes.">
  <style>
    .g-cap { fill: var(--fg, #cfdae5); font-size: 11px; letter-spacing: .10em; opacity: .94; }
    .g-s   { fill: var(--fg, #cfdae5); font-size: 11.5px; opacity: .94; }
    .g-m   { fill: var(--fg, #cfdae5); font-size: 10.5px; opacity: .82; }
    .g-rule { stroke: var(--quote-border, #4a6577); stroke-width: 1; opacity: .5; }
    .g-break { stroke: var(--fg, #5a6672); stroke-width: 1.2; stroke-dasharray: 2 3; opacity: .7; }
    .fig-a-span { fill: #4d86b8; fill-opacity: .6; }
    .fig-a-span2 { fill: #8f7ad1; fill-opacity: .6; }
    .fig-a-arena { fill: #3f7f76; fill-opacity: .55; }
    .fig-a-dim { fill: #4d86b8; fill-opacity: .3; }
  </style>
  <text class="g-cap" x="24" y="24">ONE ARENA: THE BILL, THE POOL, THE LIVE SET</text>
  <text class="g-s" x="24" y="44">the prefill graph, 34 tokens: what the book's arithmetic asks for, then what the engine actually reserves</text>
  <text class="g-m" x="24" y="82">every transient buffer its own allocation (book: sum of the trace) - scale 0 to 84.7 MiB</text>
  <rect x="24" y="92" width="700" height="28" rx="2" class="fig-a-span2" stroke="var(--quote-border, #4a6577)" stroke-width=".8"/>
  <text class="g-m" x="732" y="111">84.7 MiB</text>
  <line class="g-break" x1="24" y1="140" x2="786" y2="140"/>
  <text class="g-m" x="24" y="160">the same graph in the engine's pool - scale 0 to 3.2 MiB, so the three bars below are 28x magnified</text>
  <text class="g-m" x="24" y="190">pool high-water (engine: memory_report)</text>
  <rect x="24" y="198" width="690" height="22" rx="2" class="fig-a-span" stroke="var(--quote-border, #4a6577)" stroke-width=".8"/>
  <text class="g-m" x="722" y="214">3.00 MiB</text>
  <text class="g-m" x="24" y="240">peak live inside the phase (engine)</text>
  <rect x="24" y="248" width="471" height="22" rx="2" class="fig-a-arena" stroke="var(--quote-border, #4a6577)" stroke-width=".8"/>
  <text class="g-m" x="503" y="264">2.05 MiB</text>
  <text class="g-m" x="24" y="290">live when the phase ends (engine)</text>
  <rect x="24" y="298" width="138" height="22" rx="2" class="fig-a-dim" stroke="var(--quote-border, #4a6577)" stroke-width=".8"/>
  <text class="g-m" x="170" y="314">0.60 MiB</text>
</svg>
