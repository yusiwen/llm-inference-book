  <line class="g-rule" x1="24" y1="334" x2="786" y2="334"/>
  <text class="g-m" x="24" y="356">one arena: high-water 4.28 MiB, live-set floor 2.01 MiB (arena is 2.132x the floor), 428 of 443 allocations served from a dead buffer</text>
  <text class="g-m" x="24" y="376">the same buffers, given one allocation each, would need 84.67 MiB - 19.77x more</text>
