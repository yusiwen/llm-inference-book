<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 404" width="100%" style="max-width:100%;height:auto"
  role="img" aria-label="Thirty-six of the prefill graph's largest transient buffers, drawn as the interval they are live for, on one of six offsets inside a single arena. The 36 buffers occupy only six distinct offsets, so most of them reuse bytes a dead buffer has already released. The arena's high-water mark is 4.28 mebibytes against a live-set floor of 2.01 mebibytes, and 428 of 443 allocations are served from a dead buffer.">
  <style>
    .g-cap { fill: var(--fg, #cfdae5); font-size: 11px; letter-spacing: .10em; opacity: .94; }
    .g-s   { fill: var(--fg, #cfdae5); font-size: 11.5px; opacity: .94; }
    .g-m   { fill: var(--fg, #cfdae5); font-size: 10.5px; opacity: .82; }
    .g-rule { stroke: var(--quote-border, #4a6577); stroke-width: 1; opacity: .5; }
    .fig-a-span { fill: #4d86b8; fill-opacity: .6; }
    .fig-a-span2 { fill: #8f7ad1; fill-opacity: .6; }
  </style>
  <text class="g-cap" x="24" y="26">LIVENESS: 36 BUFFERS, 6 OFFSETS</text>
  <text class="g-s" x="24" y="46">the 36 largest transient buffers of the prefill graph - each bar runs from the node that writes the buffer to the last node that reads it</text>
  <text class="g-m" x="24" y="64">arena offset</text>
  <text class="g-m" x="150" y="64">node 0</text>
  <text class="g-m" x="700" y="64" text-anchor="end">node 442</text>
  <text class="g-m" x="24" y="93">510 KiB</text>
  <text class="g-m" x="716" y="93">1 buffer</text>
