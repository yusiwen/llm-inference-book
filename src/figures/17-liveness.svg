  <text class="g-m" x="716" y="133">1 buffer</text>
  <line class="g-rule" x1="150" y1="129" x2="700" y2="129"/>
  <rect class="fig-a-span2" x="174.8" y="118" width="6.0" height="22" rx="2"/>
