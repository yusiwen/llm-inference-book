<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 430" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="One embedding tensor of 151,936 rows of 616 bytes each, packed with no padding, and a two-row view that shares the parent bytes: the view pointer is the parent plus 616 bytes, its stride is 616, and its shape is two by 896.">
  <style>
    .fig-card { fill: var(--quote-bg, #13293d); stroke: var(--quote-border, #274357); stroke-width: 1; }
    .fig-alt  { fill: var(--table-alternate-bg, #0f2438); stroke: var(--quote-border, #274357); stroke-width: .9; }
    .fig-t    { fill: var(--fg, #dce6f0); font-size: 12.5px; font-weight: 600; }
    .fig-s    { fill: var(--fg, #cfdae5); font-size: 11.5px; opacity: .94; }
    .fig-m    { fill: var(--fg, #cfdae5); font-size: 10.5px; opacity: .82; }
    .fig-cap  { fill: var(--fg, #cfdae5); font-size: 11px; letter-spacing: .10em; opacity: .94; }
    .fig-a-row  { fill: #6b7f92; }
    .fig-a-view { fill: #3f8f6f; }
    .fig-a-ptr  { fill: #b8703f; }
    .fig-a-bracket { fill: none; stroke: #3f8f6f; stroke-width: 1.4; stroke-dasharray: 4 3; }
  </style>
  <text class="fig-cap" x="24" y="22">ONE TENSOR, FOUR FIELDS - AND A VIEW THAT OWNS NOTHING</text>
  <rect class="fig-a-row" x="30" y="70" width="300" height="24" rx="3"/>
  <text class="fig-s" x="38" y="86">row 0  -  896 values in 28 Q5_0 blocks</text>
  <text class="fig-m" x="340" y="86">byte 0</text>
  <rect class="fig-a-view" x="30" y="102" width="300" height="24" rx="3"/>
  <text class="fig-s" x="38" y="118">row 1  -  896 values in 28 Q5_0 blocks</text>
  <text class="fig-m" x="340" y="118">byte 616</text>
  <rect class="fig-a-view" x="30" y="134" width="300" height="24" rx="3"/>
  <text class="fig-s" x="38" y="150">row 2  -  896 values in 28 Q5_0 blocks</text>
  <text class="fig-m" x="340" y="150">byte 1,232</text>
  <rect class="fig-a-row" x="30" y="166" width="300" height="24" rx="3"/>
  <text class="fig-s" x="38" y="182">row 3  -  896 values in 28 Q5_0 blocks</text>
  <text class="fig-m" x="340" y="182">byte 1,848</text>
  <text class="fig-m" x="38" y="202">...</text>
  <rect class="fig-a-row" x="30" y="210" width="300" height="24" rx="3"/>
  <text class="fig-s" x="38" y="226">row 151,935  (the last)</text>
  <text class="fig-m" x="340" y="226">byte 93,591,960</text>
  <text class="fig-s" x="30" y="256">616 bytes per row, packed: no padding between rows.</text>
  <rect class="fig-a-bracket" x="22" y="99" width="316" height="62" rx="5"/>
  <text class="fig-t" x="420" y="76">the view</text>
  <text class="fig-s" x="420" y="100">shape      [2, 896]</text>
  <text class="fig-s" x="420" y="120">dtype      Q5_0</text>
  <text class="fig-s" x="420" y="140">strides    1 element, 616 bytes</text>
  <text class="fig-s" x="420" y="160">ptr        parent + 616</text>
  <text class="fig-s" x="420" y="180">length     1,232 bytes</text>
  <text class="fig-s" x="420" y="200">owns       nothing</text>
  <rect class="fig-alt" x="420" y="220" width="356" height="112" rx="5"/>
  <text class="fig-s" x="430" y="242">Copying those two rows costs 1,232 bytes.</text>
  <text class="fig-s" x="430" y="262">Not copying them costs a pointer, and a rule:</text>
  <text class="fig-s" x="430" y="282">the parent must outlive the view, and nothing</text>
  <text class="fig-s" x="430" y="302">may write to the parent while it is borrowed.</text>
  <text class="fig-m" x="430" y="320">That is a lifetime, not an optimisation.</text>
  <text class="fig-t" x="24" y="300">The arithmetic a view is made of</text>
  <text class="fig-s" x="24" y="322">offset(row) = row x 616 bytes          stride = 616 bytes between rows</text>
  <text class="fig-s" x="24" y="342">view bytes = 2 x 616 = 1,232 of 151,936 x 616 = 93,592,576</text>
  <text class="fig-s" x="24" y="362">row 1 starts at 616, which is 8 mod 16 - so a 16-byte vector load on row 1</text>
  <text class="fig-s" x="24" y="382">starts misaligned. Packed rows are why kernels have a tail case.</text>
  <text class="fig-m" x="24" y="408">All numbers from token_embd.weight in the book's 0.5B Q4_K_M file.</text>
</svg>
