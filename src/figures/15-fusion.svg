<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 420" width="100%" style="max-width:100%;height:auto"
  role="img" aria-label="The gated activation rewrite, measured. Left: before fusion, a silu node feeds a mul node that also reads up, and the mul writes the result after three passes over memory. Right: after fusion, the mul has become a swiglu node reading gate and up directly in one pass, and the silu node is still in the graph with 24 of them, but the allocator gives them no buffer and the scheduler never executes them.">
  <style>
    .f-cap { fill: var(--fg, #cfdae5); font-size: 11px; letter-spacing: .10em; opacity: .94; }
    .f-s   { fill: var(--fg, #cfdae5); font-size: 11.5px; opacity: .94; }
    .f-m   { fill: var(--fg, #cfdae5); font-size: 10.5px; opacity: .82; }
    .f-n   { fill: var(--fg, #dce6f0); font-size: 11.5px; font-weight: 600; }
    .f-box { stroke: var(--quote-border, #4a6577); stroke-width: 1.2; }
    .fig-a-node { fill: #4d86b8; fill-opacity: .18; }
    .fig-a-fused { fill: #b8703f; fill-opacity: .22; }
    .fig-a-dead { fill: #6b7a86; fill-opacity: .12; }
    .f-edge { stroke: var(--quote-border, #7f95a5); stroke-width: 1.3; fill: none; }
    .f-dash { stroke: var(--quote-border, #7f95a5); stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .f-rule { stroke: var(--quote-border, #4a6577); stroke-width: 1; opacity: .6; }
  </style>
  <text class="f-cap" x="24" y="24">ONE RULE, APPLIED 24 TIMES PER TOKEN</text>
  <text class="f-s" x="24" y="44">Mul(Silu(gate), up) becomes SwiGLU(gate, up) - and the Silu node stays where it was</text>
  <text class="f-m" x="24" y="80">before</text>
  <text class="f-m" x="430" y="80">after (what the trace shows)</text>
  <rect class="fig-a-node f-box" x="40" y="96" width="120" height="44" rx="4"/>
  <text class="f-n" x="100.0" y="116" text-anchor="middle">silu</text>
  <text class="f-m" x="100.0" y="131" text-anchor="middle">1 read, 1 write</text>
  <rect class="fig-a-node f-box" x="200" y="96" width="120" height="44" rx="4"/>
  <text class="f-n" x="260.0" y="116" text-anchor="middle">mul</text>
  <text class="f-m" x="260.0" y="131" text-anchor="middle">2 reads, 1 write</text>
  <path class="f-edge" d="M160 118 L200 118"/>
  <text class="f-m" x="168" y="110">tmp</text>
  <text class="f-m" x="40" y="164">gate</text>
  <path class="f-edge" d="M170 168 L200 168 L200 140"/>
  <text class="f-m" x="208" y="172">up</text>
  <text class="f-m" x="322" y="122">out</text>
  <path class="f-edge" d="M320 118 L352 118"/>
  <text class="f-m" x="40" y="200">5 passes over the row: read gate, write tmp, read tmp, read up, write out</text>
  <rect class="f-fused f-box" x="440" y="96" width="120" height="44" rx="4"/>
  <text class="f-n" x="500.0" y="116" text-anchor="middle">swiglu</text>
  <text class="f-m" x="500.0" y="131" text-anchor="middle">2 reads, 1 write</text>
  <rect class="f-dead f-box" x="620" y="96" width="120" height="44" rx="4"/>
  <text class="f-n" x="680.0" y="116" text-anchor="middle">silu</text>
  <text class="f-m" x="680.0" y="131" text-anchor="middle">no consumer</text>
  <text class="f-m" x="440" y="164">gate</text>
  <path class="f-edge" d="M470 168 L490 168 L490 140"/>
  <text class="f-m" x="500" y="172">up</text>
  <text class="f-m" x="562" y="122">out</text>
  <path class="f-edge" d="M560 118 L592 118"/>
  <path class="f-dash" d="M600 118 L620 118"/>
  <text class="f-m" x="604" y="110">orphan</text>
  <text class="f-m" x="430" y="200">3 passes: read gate, read up, write out - and the orphan node is skipped</text>
  <line class="f-rule" x1="24" y1="216" x2="786" y2="216"/>
  <text class="f-cap" x="24" y="240">WHAT THE ENGINE SAYS</text>
  <text class="f-s" x="24" y="262">prefill graph, 443 nodes, read out of the per-node trace</text>
  <text class="f-m" x="24" y="290">mul nodes in the executed graph</text>
  <text class="f-n" x="330" y="290">0</text>
  <text class="f-m" x="24" y="312">swiglu nodes (the rewrite output)</text>
  <text class="f-n" x="330" y="312">24</text>
  <text class="f-m" x="24" y="334">silu nodes still in the graph</text>
  <text class="f-n" x="330" y="334">24</text>
  <text class="f-m" x="24" y="356">silu nodes the trace records as executed</text>
  <text class="f-n" x="330" y="356">0</text>
  <text class="f-m" x="24" y="378">Bytes per row: 97,280 to 58,368 (-40%)</text>
  <text class="f-m" x="24" y="400">Measured on this machine: 1.06x faster on silu, 1.64x on relu (4096 rows)</text>
</svg>
