<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 440" width="100%" style="max-width:100%;height:auto"
     role="img" aria-label="One decode step of one head at a 1,024-token prefix: the query multiplies the cached keys into 1,024 scores, each score is scaled by one over the square root of 64, the causal mask keeps only the 524,800 pairs at or below the diagonal out of 1,048,576, softmax turns the kept scores into probabilities, and those weight the cached values into one output row of 64.">
