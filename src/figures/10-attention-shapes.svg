    .fig-t   { fill: var(--fg, #dce6f0); font-size: 12.5px; font-weight: 600; }
    .fig-s   { fill: var(--fg, #cfdae5); font-size: 11.5px; opacity: .94; }
    .fig-m   { fill: var(--fg, #cfdae5); font-size: 10.5px; opacity: .82; }
    .fig-cap { fill: var(--fg, #cfdae5); font-size: 11px; letter-spacing: .10em; opacity: .94; }
    .fig-a-q  { fill: #4d86b8; fill-opacity: .45; }
    .fig-a-kv { fill: #b8703f; fill-opacity: .45; }
    .fig-a-p  { fill: #3f8f6f; fill-opacity: .45; }
    .fig-a-keep { fill: #8f7ad1; fill-opacity: .55; }
    .fig-a-mask { fill: #6b7f92; fill-opacity: .30; }
    .fig-lbl { fill: var(--fg, #dce6f0); font-size: 10px; }
    .fig-rule { stroke: var(--quote-border, #4a6577); stroke-width: 1; }
  </style>
  <text class="fig-cap" x="24" y="22">ONE HEAD, ONE DECODE STEP AT A 1,024-TOKEN PREFIX</text>
  <rect class="fig-a-q" x="24" y="42" width="84" height="28" rx="2"/>
  <text class="fig-lbl" x="66" y="60" text-anchor="middle">q  1 x 64</text>
  <text class="fig-m" x="116" y="60">x</text>
  <rect class="fig-a-kv" x="132" y="42" width="96" height="28" rx="2"/>
  <text class="fig-lbl" x="180" y="60" text-anchor="middle">K  1024 x 64</text>
  <text class="fig-m" x="236" y="60">/ 8</text>
  <rect class="fig-a-p" x="262" y="42" width="104" height="28" rx="2"/>
  <text class="fig-lbl" x="314" y="60" text-anchor="middle">1,024 scores</text>
  <text class="fig-m" x="378" y="52">one per cached position: a 64-term dot,</text>
  <text class="fig-m" x="378" y="67">divided by the square root of 64</text>
  <text class="fig-m" x="132" y="86">K and V are the cache: written once, read by every query after</text>
  <text class="fig-s" x="24" y="120">the mask, drawn for a 16-token prefix: a query at row i may read key j only when j &lt;= i</text>
