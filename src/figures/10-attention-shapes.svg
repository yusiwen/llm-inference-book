  <text class="fig-m" x="170" y="154">queries grow downwards, keys to the right</text>
  <text class="fig-m" x="170" y="172">violet: kept - 524,800 pairs of 1,048,576</text>
  <text class="fig-t" x="170" y="194">50.05 per cent of the work</text>
  <text class="fig-m" x="170" y="214">The other half is above the diagonal and is never</text>
  <text class="fig-m" x="170" y="229">computed. A kernel that computes it and then multiplies</text>
  <text class="fig-m" x="170" y="244">by zero has spent twice the arithmetic on nothing.</text>
  <rect class="fig-a-p" x="24" y="292" width="104" height="28" rx="2"/>
  <text class="fig-lbl" x="76" y="310" text-anchor="middle">probabilities</text>
  <text class="fig-m" x="136" y="310">x</text>
  <rect class="fig-a-kv" x="152" y="292" width="96" height="28" rx="2"/>
  <text class="fig-lbl" x="200" y="310" text-anchor="middle">V  1024 x 64</text>
  <text class="fig-m" x="256" y="310">=</text>
  <rect class="fig-a-q" x="272" y="292" width="84" height="28" rx="2"/>
  <text class="fig-lbl" x="314" y="310" text-anchor="middle">out  1 x 64</text>
  <text class="fig-m" x="372" y="302">1,024 probabilities weight 1,024 value rows</text>
  <text class="fig-m" x="372" y="317">into one 64-number output</text>
  <line class="fig-rule" x1="24" y1="340" x2="786" y2="340"/>
  <text class="fig-s" x="24" y="362">Every number above is either a shape (1,024 x 64) or arithmetic on shapes. None of it depends on where the tokens</text>
  <text class="fig-s" x="24" y="378">are in the sequence: a position is a value the kernel is given - the mask compares indices, and the rotation in</text>
  <text class="fig-s" x="24" y="394">Chapter 9 used it - so one kernel serves prefill, decode, and a cache that starts at any offset.</text>
  <text class="fig-m" x="24" y="414">What the picture leaves out, and the last lesson covers: those two matrices are the cache, and the cache is the only</text>
  <text class="fig-m" x="24" y="428">part of a decode step that grows with the conversation.</text>
