[book]
title = "Learning LLM Inference the Hard Way"
authors = ["Siwen Yu"]
language = "en"
src = "src"
description = "Building an inference engine from scratch in Rust: the file format, the arithmetic, the graph, the devices, and the measurements that prove it"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
smart-punctuation = false
# MathJax is vendored in mathjax/ and loaded by additional-js below. mdBook's built-in
# mathjax-support injects MathJax 2.7 from cdnjs, which renders nothing when that CDN is
# unreachable or blocked by a content-security-policy. Keep it off.
mathjax-support = false
additional-js = ["mathjax/config.js", "mathjax/tex-svg.js"]
additional-css = ["css/figures.css", "css/book.css"]
no-section-label = false

# GitHub Pages, project site. The custom domain yusiwen.cn is set on the *user* site
# (yusiwen.github.io), and GitHub serves every project site of that account under it, so this
# book is published at https://yusiwen.cn/llm-inference-book/ . site-url must equal the
# repository name exactly, or the 404 page and its assets resolve against the wrong prefix.
# Do NOT set `cname` here: a CNAME file would claim the apex domain for this repository and
# fight the user site.
site-url = "/llm-inference-book/"

[output.html.fold]
enable = true
level = 0

[output.html.search]
limit-results = 30
expand = true

[output.html.print]
enable = true
